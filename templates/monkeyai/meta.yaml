schema:
  type: object
  required:
    - serviceName
    - appVersion
    - adminEmail
  properties:
    serviceName:
      type: string
      title: 服务名称
      default: monkeyai
    appVersion:
      type: string
      title: 应用版本
      default: v26111301
    adminEmail:
      type: string
      title: 初始管理员邮箱
      format: email
      default: admin@baizhi.cloud
