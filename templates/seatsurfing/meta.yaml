name: SeatSurfing
description:
  SeatSurfing is a comprehensive desk and room booking system that helps
  organizations manage their workspace efficiently. It provides a user-friendly
  interface for employees to book desks and meeting rooms, while giving
  administrators powerful tools to manage spaces, users, and bookings. The
  system includes features like real-time availability, booking management, and
  analytics to optimize space utilization.
instructions:
  Log in with admin@seatsurfing.local and the default password Sea!surf1ng, then
  change the password right away. To keep users logged in across restarts,
  generate a key pair with "openssl genrsa -traditional -out jwt.key 2048 &&
  openssl rsa -in jwt.key -pubout -out jwt.pub" and paste the output of "base64
  -w0 jwt.key" and "base64 -w0 jwt.pub" into the JWT key fields.
changeLog:
  - date: 2025-04-07
    description: First Release
  - date: 2026-11-10
    description: Version bumped to 1.140.1
links:
  - label: Website
    url: https://seatsurfing.app/
  - label: Documentation
    url: https://docs.seatsurfing.app/
  - label: Github
    url: https://github.com/seatsurfing
contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: seatsurfing
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/seatsurfing/backend:1.140.1
    jwtPrivateKey:
      type: string
      title: JWT Private Key (base64, optional)
    jwtPublicKey:
      type: string
      title: JWT Public Key (base64, optional)
benefits:
  - title: Workspace Management
    description:
      Efficiently manage desks and meeting rooms with real-time availability
      tracking.
  - title: User-Friendly Interface
    description:
      Intuitive booking interface for employees and powerful admin tools for
      managers.
  - title: Space Optimization
    description:
      Analytics and reporting tools to optimize space utilization and reduce
      costs.
  - title: Flexible Configuration
    description:
      Customizable settings for different types of spaces and booking rules.
  - title: Integration Ready
    description:
      API support for integration with other workplace management systems.
features:
  - title: Desk Booking
    description:
      Book desks with real-time availability and flexible booking options.
  - title: Room Management
    description:
      Manage meeting rooms with capacity tracking and equipment booking.
  - title: User Management
    description: Manage users, roles, and permissions with ease.
  - title: Analytics
    description:
      Track space utilization and generate reports for better decision making.
  - title: Mobile Support
    description: Access the system from any device with responsive design.
tags:
  - Workspace Management
  - Desk Booking
  - Room Booking
  - Space Management
  - Workplace Analytics
