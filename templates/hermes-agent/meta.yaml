name: Hermes Agent
description:
  Hermes Agent is an autonomous AI agent by Nous Research that runs persistently
  on your server, remembers what it learns, executes shell commands, manages
  files, browses the web, schedules cron tasks, and integrates with Telegram,
  Discord, Slack, WhatsApp, and Email. It supports 200+ models through
  OpenRouter and direct integrations with Anthropic, OpenAI, Google, and
  DeepSeek. The built-in web dashboard provides a browser-based UI for managing
  configurations, API keys, MCP servers, and chat sessions. All sessions,
  memory, skills, and configuration are stored in a persistent volume so the
  agent grows more capable over time.
instructions: >-
  The Hermes Agent web dashboard is accessible at your assigned domain. Log in
  with the dashboard username and password you configured during deployment. The
  OpenAI-compatible gateway API runs on port 8642 and the dashboard backend runs
  on port 9119 — both are published for direct access. Every field below (model
  provider keys, and the Telegram/Discord/Slack/WhatsApp/Email tokens and
  allowlists) is written straight into the container's environment, so for those
  platforms you do not need to touch the console at all — just redeploy after
  filling them in. WeChat is the one exception, since it uses QR-code pairing
  that cannot be pre-filled, so if you want it, SSH into the service console and
  run hermes gateway setup, then choose Weixin and scan the code. For anything
  else not covered below (fine-tuning allowlists further, adding a provider that
  isn't listed, or changing tool settings), SSH into the service console and run
  hermes setup to open the full configuration wizard.
changeLog:
  - date: "2026-06-17"
    description: First Release
  - date: "2026-07-27"
    description:
      Added OpenRouter, Google and DeepSeek API keys, plus fully
      env-configurable Slack, WhatsApp (Cloud API) and Email gateways with
      per-platform allowlists
