schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
    - dashboardUsername
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: hermes-agent
    appServiceImage:
      type: string
      title: App Service Image
      default: "nousresearch/hermes-agent:v2026.6.5"
    dashboardUsername:
      type: string
      title: Dashboard Username
      default: admin
    dashboardPassword:
      type: string
      title: Dashboard Password
      description:
        "Basic-auth password for the web dashboard. Auto-generated if left blank
        — find it in the service environment variables after deployment."
    gatewayAllowAllUsers:
      type: boolean
      title: Allow All Gateway Users
      description:
        "When enabled, any authenticated user can send requests to the Hermes
        gateway without an individual API key."
      default: true
    openRouterApiKey:
      type: string
      title: OpenRouter API Key
      description:
        "Recommended: the easiest way to get Hermes talking to 200+ models
        behind one key with a generous free tier. Get one at openrouter.ai/keys.
        Injected as OPENROUTER_API_KEY."
    anthropicApiKey:
      type: string
      title: Anthropic API Key
      description:
        "Optional, direct integration instead of/alongside OpenRouter. Injected
        as ANTHROPIC_API_KEY."
    openaiApiKey:
      type: string
      title: OpenAI API Key
      description:
        "Optional, direct integration instead of/alongside OpenRouter. Injected
        as OPENAI_API_KEY."
    googleApiKey:
      type: string
      title: Google API Key
      description:
        "Optional, direct integration instead of/alongside OpenRouter. Injected
        as GOOGLE_API_KEY."
    deepseekApiKey:
      type: string
      title: DeepSeek API Key
      description:
        "Optional, direct integration instead of/alongside OpenRouter. Injected
        as DEEPSEEK_API_KEY."
    telegramBotToken:
      type: string
      title: Telegram Bot Token
      description:
        "Optional: your bot token from @BotFather. Injected as
        TELEGRAM_BOT_TOKEN."
    telegramAllowedUsers:
      type: string
      title: Telegram Allowed User IDs
      description:
        "Comma-separated numeric Telegram user IDs allowed to message the bot
        (e.g. from @userinfobot). Leave blank to only allow yourself once
        paired; set to * to allow anyone."
    discordBotToken:
      type: string
      title: Discord Bot Token
      description:
        "Optional: your Discord bot token. Injected as DISCORD_BOT_TOKEN."
    discordAllowedUsers:
      type: string
      title: Discord Allowed User IDs
      description:
        "Comma-separated Discord user IDs allowed to message the bot. Leave
        blank to only allow yourself once paired; set to * to allow anyone."
    slackBotToken:
      type: string
      title: Slack Bot Token
      description:
        "Optional: the xoxb- bot token from your Slack app. Injected as
        SLACK_BOT_TOKEN."
    slackAppToken:
      type: string
      title: Slack App-Level Token
      description:
        "Required alongside the bot token for Socket Mode — the xapp- token from
        your Slack app. Injected as SLACK_APP_TOKEN."
    slackAllowedUsers:
      type: string
      title: Slack Allowed User IDs
      description:
        "Comma-separated Slack member IDs (e.g. U01ABC2DEF3) allowed to message
        the bot. Set to * to allow anyone."
    whatsappAccessToken:
      type: string
      title: WhatsApp Cloud Access Token
      description:
        "Optional: Meta access token from WhatsApp Business Cloud API setup
        (starts with EAA). Injected as WHATSAPP_CLOUD_ACCESS_TOKEN."
    whatsappPhoneNumberId:
      type: string
      title: WhatsApp Phone Number ID
      description:
        "The 15-17 digit Phone Number ID from Meta's API Setup page (not your
        phone number). Injected as WHATSAPP_CLOUD_PHONE_NUMBER_ID."
    whatsappAppSecret:
      type: string
      title: WhatsApp App Secret
      description:
        "32-char hex secret from your Meta app's Settings > Basic. Required for
        Meta to deliver messages. Injected as WHATSAPP_CLOUD_APP_SECRET."
    whatsappVerifyToken:
      type: string
      title: WhatsApp Webhook Verify Token
      description:
        "A shared secret you invent and also paste into Meta's webhook setup
        form. Injected as WHATSAPP_CLOUD_VERIFY_TOKEN."
    whatsappAllowedUsers:
      type: string
      title: WhatsApp Allowed Numbers
      description:
        "Comma-separated phone numbers with country code, no + (e.g.
        15551234567) allowed to message the bot. Set to * to allow anyone."
    emailAddress:
      type: string
      title: Email Address
      description:
        "The mailbox Hermes checks and sends from. Injected as EMAIL_ADDRESS."
    emailPassword:
      type: string
      title: Email Password
      description:
        "Use an app-specific password (e.g. Gmail App Password), not your
        regular account password. Injected as EMAIL_PASSWORD."
    emailImapHost:
      type: string
      title: Email IMAP Host
      default: imap.gmail.com
    emailImapPort:
      type: string
      title: Email IMAP Port
      default: "993"
    emailSmtpHost:
      type: string
      title: Email SMTP Host
      default: smtp.gmail.com
    emailSmtpPort:
      type: string
      title: Email SMTP Port
      default: "587"
    emailAllowedUsers:
      type: string
      title: Email Allowed Senders
      description:
        "Comma-separated email addresses allowed to message the bot. Set to * to
        allow anyone."
benefits:
  - title: Web Dashboard Included
    description:
      A built-in browser-based dashboard lets you manage API keys, MCP servers,
      messaging channels, memory, and chat sessions without touching the CLI.
      Protected by basic-auth and available at your domain immediately after
      deployment.
  - title: Persistent Memory & Skills
    description:
      The agent remembers your conversations, builds skills from experience, and
      retains context across sessions — all stored in a persistent volume on
      your own server.
  - title: Multi-Provider Model Support
    description:
      Works with 200+ models via OpenRouter plus direct integrations with
      Anthropic, OpenAI, Google, DeepSeek, and more. Switch models at any time
      with hermes model or through the dashboard.
  - title: Messaging Gateway With Allowlists
    description:
      Connect the agent to Telegram, Discord, Slack, WhatsApp, or Email, each
      locked down to a specific allowlist of users you set at deploy time — no
      open ports required for Telegram, Discord or Slack.
features:
  - title: Browser-Based Admin Dashboard
    description:
      Configure settings, manage credentials, browse the MCP catalog, and chat
      with the agent directly from a React-based web UI served at port 6432.
  - title: OpenAI-Compatible API Server
    description:
      Port 8642 exposes an OpenAI-compatible gateway so Claude Code, Open WebUI,
      Cursor, or any OpenAI SDK client can connect to Hermes as their LLM
      backend.
  - title: Autonomous Tool Use
    description:
      Built-in tools for shell execution, file operations, web search, and code
      running — the agent decides which tools to use and chains them to complete
      tasks.
  - title: Cron Scheduling
    description:
      Schedule recurring tasks with natural-language prompts and have results
      delivered to your messaging platform of choice.
  - title: MCP Server Support
    description:
      Connect any MCP-compatible server for additional tool integrations, or
      expose Hermes itself as an MCP server to Claude Code, Cursor, or other
      editors.
tags:
  - AI
  - Automation
  - Self-Hosted
  - Developer Tools
  - Productivity
