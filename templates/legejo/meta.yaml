name: Legejo
description:
  Legejo is a self-hosted library for your EPUB books. Upload books and they get
  their covers and details and land on shelves you arrange. Read them in the
  browser with highlights, notes and read-aloud, sync books, reading positions
  and highlights with a Kobo, connect reading apps such as KOReader or Thorium
  over OPDS, and keep KOReader's place in step. Several people can share one
  Legejo, each with a library of their own, and shelves of free books can be
  federated over ActivityPub and followed from Mastodon or another Legejo.
  Legejo also reads PDFs and comics in the browser, and keeps audiobooks. It
  runs on SQLite in a single container, so no database service is needed.
instructions:
  Sign in with the admin username and the password in the service's Environment
  tab (LEGEJO_ADMIN_PASSWORD). The password is used only on the first start, to
  create the admin account. Mail, the public address and searching inside the
  books can be set up on Legejo's Admin page; these and the rest (single
  sign-on, the MCP server) are also listed in the Environment tab and described
  in the README.
