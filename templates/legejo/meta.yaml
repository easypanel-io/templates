schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
    - adminUser
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: legejo
    appServiceImage:
      type: string
      title: App Service Image
      default: slurvdjur/legejo:1.33.0
    adminUser:
      type: string
      title: Admin Username
      default: admin
benefits:
  - title: Your Books on Your Server
    description:
      The whole library, database included, lives in one volume on your own
      server. No account elsewhere, no telemetry.
  - title: Read Anywhere
    description:
      Read in the browser, on a Kobo with books, positions and highlights in
      sync, or in any OPDS reading app such as KOReader or Thorium.
  - title: Share and Federate
    description:
      Share shelves with other users, give a shelf to someone on another Legejo
      with a private link, or federate shelves of free books over ActivityPub.
features:
  - title: Web Reader
    description:
      A reader in the browser with highlights, notes, search in the book and
      read-aloud, that works offline once a book is saved on the device.
  - title: Kobo Sync
    description:
      Books, reading positions and highlights sync between Legejo and a Kobo
      e-reader.
  - title: OPDS and KOReader
    description:
      Reading apps connect over OPDS with an app password, and KOReader keeps
      its reading position in step with Legejo.
  - title: PDFs, Comics and Audiobooks
    description:
      Read PDFs and CBZ comics in the browser next to the EPUBs, and listen to
      audiobooks in the browser or as a podcast feed.
  - title: Search Inside the Books
    description:
      Switch it on on the Admin page to keep the text of the EPUBs in the
      database and search inside them, with phrases and passages that open the
      book at the match.
tags:
  - eBook Management
  - Digital Library
  - Reading
  - Self-Hosted
