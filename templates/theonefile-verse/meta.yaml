name: TheOneFile_Verse
description:
  TheOneFile_Verse is the real-time collaborative wrapper around The One File —
  a single-file visual planning tool for network diagrams, smart homes, mind
  maps, and infrastructure. This edition adds multi-user rooms, live status
  monitoring, and 10,000+ icons on top of the offline-first single-file editor.
instructions: >-
  On first visit, register the admin account at /admin. From there, create rooms
  and invite others to collaborate in real time. Room data is stored on the
  "data" volume. If you just want the plain offline single-file version with no
  server, download it directly from the project's GitHub releases instead of
  deploying this template.
changeLog:
  - date: 2026-09-04
    description: first release
links:
  - label: Website
    url: https://therecanonlybe.one
  - label: GitHub
    url: https://github.com/gelatinescreams/The-One-File
  - label: Documentation
    url: https://github.com/gelatinescreams/The-One-File/blob/main/theonefile_verse/README.md
contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: theonefile-verse
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/gelatinescreams/theonefile_verse:4.1.3
    requireWsToken:
      type: boolean
      title: Require WebSocket Session Tokens
      default: true
benefits:
  - title: Real-Time Collaboration
    description:
      Multiple people can create, edit, and share diagrams together in the same
      room, live.
  - title: Still Just Diagrams
    description:
      Built on the same single-file editor — network maps, smart homes, mind
      maps, and infrastructure diagrams with 10,000+ icons.
  - title: Encrypted at Rest
    description:
      Secrets are encrypted with AES-256-GCM and PBKDF2 key derivation.
features:
  - title: Live Status Monitoring
    description:
      See live up/down status for monitored nodes directly on the diagram.
  - title: Two-Factor Authentication
    description: RFC 6238 compliant TOTP support for admin accounts.
  - title: Audit Logging
    description: Track room creation, edits, and data exports.
tags:
  - Diagramming
  - Collaboration
  - Self-Hosted
