name: Coder
description:
  Coder is an open source platform for self-hosted cloud development
  environments. Developers and their AI coding agents get provisioned,
  ready-to-code workspaces on infrastructure you own, with the IDEs, language
  runtimes, and tools your team already uses. Platform teams keep central
  control over templates, access, and cost. Paid tiers add security, governance,
  and observability capabilities.
instructions: |
  Before deploying, set the Docker Group ID to match your host: run
  `getent group docker | cut -d: -f3` over SSH and enter the result. A mismatch
  stops Coder from reaching the Docker daemon and every workspace build fails.
  After the deploy, open the app domain and create the first administrator
  account. Workspaces run as sibling containers on the same host, so size the
  server for Coder (roughly 2 CPU cores and 4 GB) plus every workspace you
  expect, and delete workspaces from the Coder dashboard before removing this
  service. The mounted Docker socket gives Coder root-equivalent control of the
  host. The optional Wildcard Domain enables subdomain-based workspace apps and
  port sharing, and also needs a wildcard DNS record and certificate.
