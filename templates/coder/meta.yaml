schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
    - databaseServiceName
    - dockerGroupId
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: coder
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/coder/coder:v2.36.5
    databaseServiceName:
      type: string
      title: Database Service Name
      default: coder-db
    dockerGroupId:
      type: string
      title: Docker Group ID
      description: >-
        GID of the host docker group. Find it by running `getent group docker |
        cut -d: -f3` on the server.
      default: "999"
    wildcardDomain:
      type: string
      title: Wildcard Domain
      description: >-
        Optional. Parent domain for subdomain-based workspace apps and port
        sharing, for example coder.example.com. Needs a wildcard DNS record and
        certificate.
      default: ""
