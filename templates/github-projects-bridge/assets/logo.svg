<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>GitHub Projects Bridge</title>
  <desc>Git branch, project board and MCP connected by a bridge</desc>
  <rect width="512" height="512" rx="96" fill="#fff"/>
  <rect x="20" y="20" width="472" height="472" rx="78" fill="none" stroke="#d0d7de" stroke-width="4"/>

  <!-- Git graph -->
  <g fill="none" stroke="#24292f" stroke-width="15" stroke-linecap="round">
    <path d="M112 112v96"/>
    <path d="M112 160c0-26 21-47 47-47"/>
    <path d="M159 113v-1"/>
    <path d="M112 208c0 26 21 47 47 47h20"/>
  </g>
  <circle cx="112" cy="102" r="25" fill="#24292f"/>
  <circle cx="174" cy="112" r="25" fill="#24292f"/>
  <circle cx="198" cy="255" r="25" fill="#24292f"/>

  <!-- Project board -->
  <rect x="278" y="82" width="156" height="166" rx="22" fill="#fff" stroke="#24292f" stroke-width="10"/>
  <path d="M330 94v142M382 94v142" stroke="#d0d7de" stroke-width="7"/>
  <rect x="294" y="103" width="23" height="34" rx="6" fill="#24292f"/>
  <rect x="294" y="148" width="23" height="34" rx="6" fill="#d0d7de"/>
  <rect x="294" y="193" width="23" height="34" rx="6" fill="#24292f"/>
  <rect x="346" y="103" width="23" height="34" rx="6" fill="#d0d7de"/>
  <rect x="346" y="148" width="23" height="34" rx="6" fill="#24292f"/>
  <rect x="346" y="193" width="23" height="34" rx="6" fill="#d0d7de"/>
  <rect x="398" y="103" width="20" height="34" rx="6" fill="#24292f"/>
  <rect x="398" y="148" width="20" height="34" rx="6" fill="#d0d7de"/>
  <rect x="398" y="193" width="20" height="34" rx="6" fill="#24292f"/>

  <!-- Bridge -->
  <path d="M82 298c57 0 70-62 174-62s117 62 174 62" fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round"/>
  <path d="M82 298c57 0 70-62 174-62s117 62 174 62" fill="none" stroke="#24292f" stroke-width="28" stroke-linecap="round"/>
  <path d="M171 282v-27M207 264v-23M243 248v-14M279 248v-14M315 264v-23M351 282v-27"
        stroke="#fff" stroke-width="7" stroke-linecap="round"/>

  <!-- MCP connector -->
  <circle cx="82" cy="298" r="15" fill="#24292f"/>
  <circle cx="430" cy="298" r="15" fill="#24292f"/>
  <path d="M82 314v27c0 15 12 27 27 27h63" fill="none" stroke="#24292f" stroke-width="8" stroke-linecap="round"/>
  <path d="M430 314v27c0 15-12 27-27 27h-63" fill="none" stroke="#24292f" stroke-width="8" stroke-linecap="round"/>

  <rect x="170" y="354" width="172" height="78" rx="24" fill="#24292f"/>
  <text x="256" y="405" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700"
        text-anchor="middle" letter-spacing="2">MCP</text>
</svg>