<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>GitHub Projects Bridge</title>
  <desc>Bridge connecting GitHub Projects and MCP</desc>
  <defs>
    <linearGradient id="bridge" x1="80" y1="260" x2="432" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0f172a"/>
  <rect x="34" y="34" width="444" height="444" rx="82" fill="#111b35" stroke="#25345d" stroke-width="3"/>

  <!-- GitHub side -->
  <circle cx="154" cy="164" r="72" fill="#fff" filter="url(#shadow)"/>
  <path fill="#111827" d="M154 111c-30 0-54 24-54 54 0 24 15 44 36 51v-13c-7 2-10-3-10-3-5-11-12-14-12-14-10-7 1-7 1-7 11 1 17 12 17 12 10 17 25 12 31 9 1-7 4-12 7-15-24-3-49-12-49-52 0-12 4-21 11-29-1-3-5-14 1-28 0 0 9-3 30 11 9-3 19-4 28-4s19 1 28 4c21-14 30-11 30-11 6 14 2 25 1 28 7 8 11 17 11 29 0 40-25 49-49 52 4 4 7 11 7 22v32c21-7 36-27 36-51 0-30-24-54-54-54z"/>

  <!-- Project board side -->
  <g filter="url(#shadow)">
    <rect x="266" y="90" width="82" height="142" rx="20" fill="url(#card)" stroke="#334155" stroke-width="3"/>
    <rect x="358" y="110" width="82" height="142" rx="20" fill="url(#card)" stroke="#334155" stroke-width="3"/>
  </g>
  <rect x="282" y="110" width="50" height="28" rx="8" fill="#2f81f7"/>
  <rect x="282" y="150" width="50" height="28" rx="8" fill="#8b5cf6"/>
  <rect x="282" y="190" width="50" height="24" rx="8" fill="#34d399"/>
  <rect x="374" y="130" width="50" height="28" rx="8" fill="#8b5cf6"/>
  <rect x="374" y="170" width="50" height="28" rx="8" fill="#34d399"/>
  <rect x="374" y="210" width="50" height="24" rx="8" fill="#2f81f7"/>

  <!-- Bridge -->
  <path d="M82 280c54 0 67-62 174-62s120 62 174 62" fill="none" stroke="#0b1022" stroke-width="38" stroke-linecap="round"/>
  <path d="M82 280c54 0 67-62 174-62s120 62 174 62" fill="none" stroke="url(#bridge)" stroke-width="26" stroke-linecap="round"/>
  <path d="M171 265v-30M206 248v-22M242 231v-13M278 231v-13M314 248v-22M349 265v-30" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <!-- MCP connector -->
  <circle cx="82" cy="280" r="15" fill="#2f81f7"/>
  <circle cx="430" cy="280" r="15" fill="#8b5cf6"/>
  <path d="M82 295v38c0 14 11 25 25 25h65" fill="none" stroke="#2f81f7" stroke-width="8" stroke-linecap="round"/>
  <path d="M430 295v38c0 14-11 25-25 25h-65" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <rect x="172" y="350" width="168" height="82" rx="25" fill="#111827" stroke="url(#bridge)" stroke-width="8"/>
  <text x="256" y="401" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" letter-spacing="2">MCP</text>
</svg>