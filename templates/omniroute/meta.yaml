name: OmniRoute
description:
  OmniRoute is an MIT-licensed, OpenAI-compatible AI gateway that gives you one
  endpoint for hundreds of providers and models. It auto-routes and falls back
  across your subscriptions and API keys (Subscription → API Key → Cheap → Free
  tiers), so coding tools like Claude Code, Cursor, Codex, and Cline keep
  working even when a provider hits a rate limit or quota. It ships a dashboard
  for managing providers, keys, and subscription OAuth logins, with live usage
  analytics, token-compression, and circuit breakers to avoid dead keys. It is
  not a LiteLLM replacement - LiteLLM is a YAML/model_list config layer, while
  OmniRoute is a dashboard plus subscription OAuth with automatic multi-tier
  fallback.

instructions:
  Open the dashboard at your domain and log in with the admin password shown in
  this service's environment variables (INITIAL_PASSWORD) - change it
  immediately under Settings → Security. Then add a provider or connect a
  subscription via OAuth from the dashboard to start routing requests through
  http://your-domain/v1.

