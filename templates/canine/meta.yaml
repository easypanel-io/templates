name: Canine
description:
  Canine is a self-hosted, Heroku-style dashboard for deploying and managing
  apps on your own Kubernetes cluster (or directly on this Docker host in local
  mode). Deploy straight from a Git repository using buildpacks or a Dockerfile,
  manage environment variables and one-off releases, stream build and runtime
  logs, and connect a real cluster later through the UI once you are ready to
  run production workloads.
instructions: |
  Open the app URL and create the first account to sign in. The web and
  worker services are both given direct access to the host's Docker socket
  so Canine can build and run containers locally, so keep this deployment
  behind authentication and restrict access to people you trust. A real
  Kubernetes cluster is only required once you want to deploy workloads to
  one; the dashboard itself boots and works without one.
changeLog:
  - date: 2026-07-13
    description: first release
links:
  - label: GitHub
    url: https://github.com/CanineHQ/canine
contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: canine
    appServiceImage:
      type: string
      title: App Service Image
      description: Only a "latest" tag is published upstream for this image.
      default: ghcr.io/caninehq/canine:latest@sha256:a058034ca006d5899e95f2f07adbbf2aa3c4fa16475cf4e7e895d79d9355d9c3
benefits:
  - title: Heroku-Style Workflow, Self-Hosted
    description:
      Deploy from a Git repository with buildpacks or a Dockerfile the same way
      you would on Heroku, but running entirely on infrastructure you control.
  - title: Bring Your Own Cluster
    description:
      Connect any Kubernetes cluster's kubeconfig through the UI once you are
      ready, instead of being locked into a specific managed provider.
  - title: No Redis Required
    description:
      Background jobs and real-time updates both run on Postgres, so there is
      one fewer service to operate compared to a typical Rails stack.
features:
  - title: Git-Based Deployments
    description:
      Push to a connected repository and Canine builds and rolls out the new
      release automatically.
  - title: Environment Variable Management
    description:
      Manage secrets and config per app from the dashboard, without editing YAML
      by hand.
  - title: Live Build and Runtime Logs
    description:
      Stream build output and container logs in real time to debug a deployment
      as it happens.
  - title: Multi-Cluster Support
    description:
      Attach multiple Kubernetes clusters and deploy different apps to different
      clusters from the same dashboard.
tags:
  - Self-Hosted
  - PaaS
  - Kubernetes
  - Docker
  - DevOps
