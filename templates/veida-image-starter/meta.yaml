name: Veida AI Image Starter
description: >-
  Unlimited free AI image generator. A one-page text-to-image web app: type a
  prompt, pick 1:1, 16:9 or 9:16, and get the picture back in about a minute.
  One small Node server with no dependencies and no database. It runs on the
  free anonymous tier of the Veida AI image API out of the box; set
  VEIDA_API_KEY to run on your own account.
instructions: |
  Open your domain and type a prompt. Without an API key the app uses Veida
  AI's free anonymous tier (watermarked, limited daily runs per server IP). To
  run on your own account, create a key at
  https://veida.ai/settings/apikeys and set VEIDA_API_KEY in the service
  environment.
changeLog:
  - date: 2026-11-18
    description: first release
links:
  - label: Website
    url: https://veida.ai/?utm_source=easypanel&utm_medium=template
  - label: Documentation
    url: https://veida.readthedocs.io/en/latest/
  - label: Github
    url: https://github.com/hanshs474/veida-image-starter
contributors:
  - name: Veida AI
    url: https://github.com/hanshs474
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: veida-image-starter
    appServiceImage:
      type: string
      title: App Service Image
      default: san8888/veida-image-starter:latest
    veidaApiKey:
      type: string
      title: Veida AI API Key (optional)
      default: ""
benefits:
  - title: Works With Nothing Configured
    description:
      Deploy and generate right away on the free anonymous tier. No account, no
      key and no database to set up first.
  - title: Your Own Image Generator
    description:
      A private prompt-to-picture page on your own domain, for a team or for
      testing prompts before writing client code.
features:
  - title: Three Aspect Ratios
    description: Square, landscape (16:9) and portrait (9:16) output.
  - title: Readable Quota Messages
    description:
      When the free credits run out, the page says so in plain words instead of
      failing silently.
  - title: Bring Your Own Key
    description:
      Set VEIDA_API_KEY to run on your Veida AI account across Veida AI Image v1
      and additional models.
tags:
  - AI
  - Image Generation
  - Text to Image
