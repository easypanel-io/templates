name: OpenLMNP
description:
  OpenLMNP is a self-hosted accounting application for French furnished rentals
  taxed under the LMNP regime (Location Meublée Non Professionnelle). It
  computes the depreciation schedules that make the "régime réel" worth choosing
  (building components, furniture, renovation works), keeps the books of each
  fiscal year, and produces what the tax office expects at the end of it — the
  2031/2033 forms as a PDF and a compliant FEC ledger export. It also imports
  Airbnb payout CSV files, tracks loans and their deductible interest, and
  compares the "régime réel" against the flat-rate micro-BIC before you commit
  to either. Everything runs on SQLite inside your own volumes, and no
  accounting, personal or tax data ever leaves the server.
instructions:
  Open /register right after the deployment — the first account created becomes
  the administrator, and sign-up then closes by itself. Without an SMTP server
  the "forgot password" link stays inert; reset a password from the server
  instead with `php artisan openlmnp:reset-password you@example.com`.
