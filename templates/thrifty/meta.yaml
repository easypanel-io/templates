name: Thrifty
description:
  Thrifty is a simple self-hosted budgeting and expense tracker for households.
  Track spending across multiple users without accounts or passwords — the app
  itself has no login system of any kind, so this template protects the UI with
  HTTP Basic Auth instead.
instructions:
  Open the UI's app URL and sign in with the HTTP Basic Auth prompt using
  username admin and the auto-generated password shown as this service's first
  basic auth entry in Easypanel. The API's own domain has no login prompt of its
  own (the UI's JavaScript can't send Basic Auth credentials on its own to a
  second domain), so don't share that URL; only the UI's URL is meant to be
  visited directly.
changeLog:
  - date: 2026-07-21
    description: first release
links:
  - label: GitHub
    url: https://github.com/tiehfood/thrifty
contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
schema:
  type: object
  required:
    - appServiceName
    - uiServiceImage
    - apiServiceImage
    - currencyCode
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: thrifty
    apiDomain:
      type: string
      title: API Domain
      description:
        A second domain pointed at this project, without https:// or a trailing
        slash (e.g. api.yourdomain.com). Add it under this project's domains in
        Easypanel first — the UI calls the API directly on this domain from the
        browser. If not provided, it will be automatically generated.
    uiServiceImage:
      type: string
      title: UI Service Image
      default: tiehfood/thrifty-ui:1.12.1
    apiServiceImage:
      type: string
      title: API Service Image
      default: tiehfood/thrifty-api:1.12.1
    currencyCode:
      type: string
      title: Currency
      oneOf:
        - enum:
            - EUR
          title: Euro
        - enum:
            - USD
          title: US Dollar
        - enum:
            - GBP
          title: British Pound
        - enum:
            - CAD
          title: Canadian Dollar
        - enum:
            - AUD
          title: Australian Dollar
      default: EUR
benefits:
  - title: No Accounts, No Passwords
    description:
      Add household members as simple named users with no login of their own, so
      tracking shared spending doesn't mean managing credentials for everyone.
  - title: Lightweight, No External Database
    description:
      Runs on SQLite with nothing else to provision, so it stays cheap to host
      for a household budget tracker.
  - title: Multi-User Household Tracking
    description:
      See who spent what across the household in one shared view instead of
      juggling separate spreadsheets.
features:
  - title: Multi-User Support
    description:
      Track expenses per household member while keeping everything in one shared
      budget.
  - title: Configurable Currency
    description: Display amounts in your household's own currency.
  - title: Swagger API Docs
    description:
      The API ships with interactive Swagger documentation at
      /swagger/index.html for anyone who wants to script against it.
tags:
  - Budgeting
  - Personal Finance
  - Self-Hosted
  - Household
