name: GitSave
description:
  GitSave is a self-hosted and open-source application that backs up your Git
  repositories on a schedule. It supports GitHub, GitLab and other Git
  platforms, lets you choose how many backups to keep, and can back up to a
  local volume or an SMB share. GitSave includes an easy to use and responsive
  web interface for managing schedules, pausing or resuming backups, and viewing
  backup history.
instructions: >-
  Change the ENCRYPTION_SECRET after first deploy only if you have not stored
  any access tokens yet, since existing tokens are encrypted with it. Set
  DISABLE_AUTH to true only if you are putting GitSave behind your own
  authentication provider.
changeLog:
  - date: 2026-07-24
    description: first release
links:
  - label: Website
    url: https://witzdam.com
  - label: GitHub
    url: https://github.com/TimWitzdam/GitSave
contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: gitsave
    appServiceImage:
      type: string
      title: App Service Image
      default: timwitzdam/gitsave:1.3.6
    disableAuth:
      type: boolean
      title: Disable Built-in Authentication
      default: false
benefits:
  - title: Scheduled Backups
    description: Automatically back up Git repositories on a recurring schedule
  - title: Multi-Platform
    description: Works with GitHub, GitLab and other Git platforms
  - title: Self-Hosted
    description: Keep control of your repository backups on your own storage
features:
  - title: Backup History
    description: View a full history of every backup that has run
  - title: Retention Control
    description: Choose how many backups to keep per schedule
  - title: SMB Support
    description: Back up directly to an SMB share
  - title: Pause and Resume
    description: Pause or resume individual backup schedules
tags:
  - Backup
  - Git
  - Developer Tools
  - Self-Hosted
