name: Free Image to Video Starter
description: >-
  Free image to video AI with no daily cap: start with no sign-up, keep going
  on a free account. Every video comes with sound and no watermark. Deploy a
  one-page AI video generator backed by the Free Image to Video HTTP API.
instructions: |
  Open your domain, set FREEIMAGETOVIDEO_API_KEY from
  https://freeimagetovideo.ai/settings/apikeys in your service environment, and
  optionally set ACCESS_PASSWORD to gate generation behind a shared password.
  API runs require a paid plan on Free Image to Video
  (https://freeimagetovideo.ai/pricing); the hosted web generator starts free
  with no sign-up at https://freeimagetovideo.ai/.
changeLog:
  - date: 2026-11-20
    description: first release
links:
  - label: Website
    url: https://freeimagetovideo.ai/?utm_source=easypanel&utm_medium=template
  - label: Documentation
    url: https://freeimagetovideo.readthedocs.io/en/latest/
  - label: Github
    url: https://github.com/hanshs474/fitv-video-starter
contributors:
  - name: Free Image to Video AI
    url: https://github.com/hanshs474
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: fitv-video-starter
    appServiceImage:
      type: string
      title: App Service Image
      default: san8888/fitv-video-starter:1.0.0
    freeimagetovideoApiKey:
      type: string
      title: Free Image to Video API Key (optional)
      default: ""
    accessPassword:
      type: string
      title: Access Password (optional)
      default: ""
benefits:
  - title: Ready-to-Deploy Container
    description:
      Minimal zero-dependency Node server packaged as
      san8888/fitv-video-starter:1.0.0 with a /health endpoint built in.
  - title: Sound and No Watermark
    description:
      Every generated 4 to 15 second clip includes native synchronized audio
      and clean output with no watermark.
features:
  - title: Image to Video and Text to Video
    description: Animate a public HTTPS photo URL or generate directly from a text prompt.
  - title: Three Aspect Ratios and 480p/768p
    description: Supports 16:9, 9:16, and 1:1 outputs across 4 to 15 second durations.
  - title: Optional Access Password
    description:
      Protect /api/generate with ACCESS_PASSWORD when sharing with a team.
tags:
  - AI
  - Video Generation
  - Image to Video
