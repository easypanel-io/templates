name: OpenTodo
description:
  OpenTodo is an open-source, self-hosted, local-first task manager. It works
  offline, syncs every device through one small container with SQLite, and
  replaces subscription task apps with a server you own.
instructions:
  Open the domain of the service. The first visit creates the owner account and
  asks for the setup token; find it in the service's Environment tab
  (OPENTODO_SETUP_TOKEN). After that, sign-up is closed and the owner invites
  people. If you change the domain, set OPENTODO_BASE_URL to the new https
  address. Your data lives in the "data" volume, mounted at /data.
