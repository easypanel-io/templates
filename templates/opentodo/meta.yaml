benefits:
  - title: Your Tasks, Your Server
    description:
      Every task, project and comment stays in one SQLite file on your own
      server. There is no telemetry and no third-party network calls.
  - title: Works Offline
    description:
      The web app keeps a local copy on each device, so you can keep working
      without a connection and changes sync when you are back online.
  - title: Small and Simple
    description:
      One container, one volume and no required configuration. No database
      server or cache to run next to it.
features:
  - title: Sync Across Devices
    description:
      Field-level sync merges edits from every device, so two people changing
      different fields of the same task never overwrite each other.
  - title: Installable App
    description:
      Install OpenTodo as an app on desktop and phone straight from the browser.
  - title: Open Formats
    description:
      Export everything at any time, and connect calendar apps through CalDAV.
