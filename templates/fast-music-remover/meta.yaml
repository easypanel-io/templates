benefits:
  - title: Music and Noise Removal
    description:
      Uses DeepFilterNet to strip background music and noise from videos and
      audio files while keeping speech intact
  - title: URL or File Input
    description:
      Submit a YouTube (or other) video URL for automatic download, or upload a
      local file directly through the web UI
  - title: CPU-Only Processing
    description:
      Runs entirely on CPU via ONNX models, so no GPU is required to process
      media
features:
  - title: Web UI
    description:
      A minimalistic frontend lets you submit media and preview the processed
      result without touching the command line
  - title: C++ MediaProcessor Core
    description:
      A dedicated C++ engine handles audio extraction, filtering, and re-muxing
      for efficient processing
