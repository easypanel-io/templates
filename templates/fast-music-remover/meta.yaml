name: Fast Music Remover
description:
  Fast Music Remover strips background music and noise from videos and audio
  files using DeepFilterNet, so you keep the speech or content you actually
  want. Submit a YouTube (or other) URL or upload a file through the built-in
  web UI, and it downloads or accepts the media, runs it through a C++
  MediaProcessor core, and serves back the cleaned result for playback or
  download.
instructions: >-
  Open the app on the assigned domain to submit a video URL or upload a file for
  processing; uploaded and processed media persist in the "uploads" volume.
  Processing runs on CPU via DeepFilterNet's ONNX models, so no GPU is required,
  but larger files will take longer and use more CPU/RAM — size resources
  accordingly for heavier workloads.
