name: OSTicket
description:
  OSTicket is a widely-used, open-source ticketing system designed to streamline
  customer support management. It provides a user-friendly interface for
  handling, tracking, and organizing support tickets across multiple channels,
  including email, web forms, and API integrations. With OSTicket, you can
  efficiently manage inquiries, automate workflows, and improve customer
  satisfaction.
instructions:
  The official osTicket Docker image has been discontinued, so this template
  runs a community-built image instead (github.com/dtsoden/osticket), which
  builds from osTicket's own release source and is rebuilt automatically as new
  versions ship. OSTicket installs itself on the first start, which takes a
  minute while the database comes up. Sign in to the staff panel at /scp with
  the admin username you chose. If you left the admin password empty, a random
  one was generated; find it as ADMIN_PASS in the app's Environment tab. The
  helpdesk and admin settings are only used for that first install; change them
  later in the staff panel. SMTP settings are optional and are used for outgoing
  mail from any email address that has no SMTP account set up inside OSTicket.
changeLog:
  - date: 2026-10-27
    description:
      Replaced the discontinued official image with a community-maintained image
      built from osTicket's own releases, generated the install secret instead
      of hardcoding it, and added timezone and SMTP security as form fields
  - date: 2024-12-16
    description: Template Release

links:
  - label: Website
    url: https://osticket.com
  - label: Documentation
    url: https://docs.osticket.com
  - label: Github
    url: https://github.com/osTicket/osTicket

contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
  - name: David Soden
    url: https://github.com/dtsoden

schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
    - helpdeskName
    - helpdeskEmail
    - adminFirstName
    - adminLastName
    - adminEmail
    - adminUsername
    - timezone
    - smtpServerPort
    - smtpSecurity
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: osticket
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/dtsoden/osticket:1.18.4
    helpdeskName:
      type: string
      title: Helpdesk Name
      default: My Helpdesk
      description: Name of your helpdesk, shown to customers and in emails.
    helpdeskEmail:
      type: string
      title: Helpdesk Email
      default: support@example.com
      description: Address customers write to. Must differ from the admin email.
    adminFirstName:
      type: string
      title: Admin First Name
      default: John
    adminLastName:
      type: string
      title: Admin Last Name
      default: Doe
    adminEmail:
      type: string
      title: Admin Email
      default: admin@example.com
    adminUsername:
      type: string
      title: Admin Username
      default: ostadmin
      description:
        Letters, digits, dots, dashes and underscores. "admin" and "osticket"
        are not allowed.
    adminPassword:
      type: string
      title: Admin Password
      secret: true
      description:
        6 to 128 characters. Leave empty to generate one (shown as ADMIN_PASS in
        the Environment tab).
    timezone:
      type: string
      title: Timezone
      default: UTC
      description: A tz database name, for example America/New_York.
    smtpServerHost:
      type: string
      title: SMTP Server Host
      description: Leave empty to skip outgoing mail setup.
    smtpServerPort:
      type: integer
      title: SMTP Server Port
      default: 587
    smtpSecurity:
      type: string
      title: SMTP Security
      default: starttls
      oneOf:
        - enum:
            - starttls
          title: STARTTLS (usually port 587)
        - enum:
            - tls
          title: TLS (usually port 465)
        - enum:
            - none
          title: None (usually port 25)
    smtpServerUsername:
      type: string
      title: SMTP Server Username
    smtpServerPassword:
      type: string
      title: SMTP Server Password
      secret: true
    smtpFromEmail:
      type: string
      title: SMTP From Email
      description: Envelope sender, usually the same as the helpdesk email.

benefits:
  - title: Streamlined Ticket Management
    description:
      OSTicket simplifies the process of handling, organizing, and managing
      customer support tickets across multiple channels, improving response
      times and customer satisfaction.
  - title: Self-Hosted Solution
    description:
      Retain full control over your customer support system with a self-hosted
      solution, ensuring privacy and security for your organization.
  - title: Workflow Automation
    description:
      Automate common support processes like ticket routing, escalation, and
      responses to save time and boost team efficiency.
features:
  - title: Multi-Channel Ticket Support
    description:
      Receive and manage tickets through email, web forms, and API integrations
      to centralize customer inquiries in one platform.
  - title: Customizable Ticket Workflows
    description:
      Define custom workflows, forms, and fields to meet your specific support
      needs.
  - title: Reporting and Analytics
    description:
      Gain valuable insights into your support team's performance with built-in
      reporting and analytics tools.
  - title: SLA Management
    description:
      Track and enforce Service Level Agreements (SLAs) to ensure tickets are
      resolved within committed timelines.
  - title: Knowledge Base
    description:
      Provide self-service options to customers by creating and managing a
      searchable knowledge base with FAQs and guides.
tags:
  - Ticketing System
  - Customer Support
  - Self-Hosted
  - Workflow Automation
  - SLA Management
