    databaseServiceName:
      type: string
      title: Database Service Name
      default: erd-builder-pro-db
benefits:
  - title: Schema and documentation in one place
    description:
      Keep ERDs, flowcharts, notes, and drawings together in one project.
  - title: Visual or code-first
    description:
      Edit the same schema on the ERD canvas or in DBML, then export SQL DDL.
  - title: Self-hosted
    description:
      Your diagrams and documents stay in your own PostgreSQL database.
