name: ERD Builder Pro
description:
  ERD Builder Pro is a workspace for designing database schemas and documenting
  how your systems work. Model tables and relationships in an ERD canvas or a
  DBML editor, export SQL DDL for PostgreSQL and MySQL, and keep flowcharts,
  rich-text notes, and drawings in the same project. An optional AI assistant
  drafts SQL, sample data, and flowcharts with your own provider key.
instructions:
  Open the app right after deployment and create the administrator account. The
  first account becomes the SuperAdmin. Keep the ERD_ENCRYPTION_KEY value; it
  decrypts saved database passwords and AI keys. The image supports amd64
  (x86_64) servers only.
changeLog:
  - date: 2026-11-15
    description: first release
